// This small, independent guard remains usable when the main application script fails to start.
window.__salesStarted=false;
(function(){
  var reported=false;
  function report(message){
    if(window.__salesStarted||reported)return;
    var root=document.getElementById('magazin-vertrieb');
    if(!root)return;
    reported=true;
    root.innerHTML='<div class="m-login"><h1>App-Start fehlgeschlagen</h1><p>Bitte die folgende technische Meldung einschließlich Versionskennung mitteilen.</p><pre class="m-detail"></pre><p>Oberfläche 2026-09-28-r15</p></div>';
    root.querySelector('pre').textContent=message;
  }
  window.addEventListener('error',function(event){
    if(!event.message)return;
    report(String(event.message).slice(0,500)+(event.lineno?' · Zeile '+event.lineno+', Spalte '+(event.colno||0):''));
  });
  window.setTimeout(function(){report('Das Hauptskript wurde innerhalb von 8 Sekunden nicht gestartet. Es wurde keine JavaScript-Fehlermeldung übermittelt.');},8000);
})();
</script>

  function updateHistoryFields(){

    updateHistoryFields();
  }
  async function act(fn,{reload=false,preserve=false}={}){if(busy)return;busy=true;root.setAttribute('aria-busy','true');error='';let result;if(preserve){root.querySelectorAll('button').forEach(b=>b.disabled=true);}else render();try{result=await fn();if(result?.message)message=result.message;if(reload)state=await rpc('getSalesState');}catch(e){error=e.message;if(preserve){busy=false;root.querySelectorAll('button').forEach(b=>b.disabled=false);const status=root.querySelector('.m-status');if(status){status.textContent=error;status.classList.add('m-error');}return;}}finally{busy=false;root.setAttribute('aria-busy','false');}render();return result;}
  async function runCreateJob(id,step){
    return act(async()=>{const r=await rpc('runSalesJob',id,step);preview=await rpc('getSalesJobPreview',id);if(selected==='draft_'+id)detail=await rpc('getSalesCompany',selected);return r;},{reload:true});
  }
  // V1_FUNCTIONS
  root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='pause-import'){v1Click(a,id);return;}if(busy)return;if(v1Click(a,id))return;if(a==='theme'){theme=theme==='dark'?'light':'dark';root.dataset.theme=theme;b.textContent=theme==='dark'?'Helle Ansicht':'Dunkle Ansicht';try{localStorage.setItem('sales-theme',theme);}catch(_){}return;}if(a==='nav'){view=id;search='';message='';error='';render();return;}
    if(a==='reload')return act(async()=>{state=await rpc('getSalesState');return {message:'Frisch aus Firebase geladen. Kein HQ-Aufruf.'};});
    if(a==='company')return act(async()=>{historyFilter='all';selected=id;detail=await rpc('getSalesCompany',id);view='company';});
    if(a==='read-company')return act(async()=>{detail=await rpc('getSalesCompany',id);return {message:detail?'Firmendetails aus Firebase geladen.':'Noch keine Firmendetails in Firebase. Bitte den Detailimport starten.'};});
    if(a==='sync-history')return act(async()=>{const result=await rpc('syncSalesHistory',id);detail=await rpc('getSalesCompany',id);return result;});
    if(a==='check-history-binding')return act(async()=>{try{return await rpc('checkSalesHistoryBinding',id);}finally{state=await rpc('getSalesState');if(view==='company')detail=await rpc('getSalesCompany',selected);}});
    if(a==='sync-company')return act(async()=>{const result=await rpc('syncSalesCompany',id);detail=await rpc('getSalesCompany',id);return result;});
    if(a==='sync-edition')return act(()=>rpc('syncSalesEdition'));
    if(a==='sync-catalog')return act(()=>rpc('syncSalesCatalog'),{reload:true});
    if(a==='audit-test')return act(async()=>{audit=await rpc('getSalesTestAudit',id);auditId=id;return {message:'Eigene Testfirma in HQ und Firebase verglichen.'};});
    if(a==='contact-email')return act(async()=>{const r=await rpc('queueSalesContactEmail',id);preview=await rpc('getSalesJobPreview',r.id);view='preview';return r;},{reload:true});
    if(a==='cleanup-marker')return act(async()=>{const r=await rpc('queueSalesMarkerCleanup',id);preview=await rpc('getSalesJobPreview',r.id);view='preview';return r;},{reload:true});
    if(a==='preview')return act(async()=>{preview=await rpc('getSalesJobPreview',id);view='preview';});
    if(a==='create-company'||a==='create-contact')return runCreateJob(id,a==='create-company'?'company':'contact');
    if(a==='run-job'){const job=state.jobs.find(j=>j.id===id);if(job?.kind==='createCompany')return runCreateJob(id,'company');return act(async()=>{const r=await rpc('runSalesJob',id);preview=await rpc('getSalesJobPreview',id);if(preview.job.kind==='cleanupMarker'&&r.state==='synced'){audit=null;auditId=null;}return r;},{reload:true});}
    if(a==='reconcile')return act(async()=>{const r=await rpc('reconcileSalesJob',id);if(selected==='draft_'+id)detail=await rpc('getSalesCompany',selected);return r;},{reload:true});
    if(a==='conflict-hq'||a==='conflict-app')return act(()=>rpc('resolveSalesConflict',id,a==='conflict-hq'?'hq':'app'),{reload:true});
    if(a==='history-form'){if(!state.drafts.find(d=>d.id===id)?.testOnly||!state.jobs.find(j=>j.id===id)?.hqId){error='Zuerst die eigene Testfirma in HQ anlegen.';render();return;}formDraft=state.drafts.find(d=>d.id===id);const now=new Date();formContactOn=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,16);view='history';render();return;}
    if(a==='change-form')return act(async()=>{formDraft=state.drafts.find(d=>d.id===id);detail=await rpc('getSalesCompany',formDraft.hqId);if(!detail)throw new Error('Zuerst Firmendetails importieren.');view='change';});
  });
  root.addEventListener('input',e=>{if(e.target.id==='contact-search'){const position=e.target.selectionStart;search=e.target.value;render();const input=root.querySelector('#contact-search');input.focus();input.setSelectionRange(position,position);return;}if(e.target.id==='search'){search=e.target.value;root.querySelector('#customer-rows').innerHTML=v1CustomerRows(view!=='magazine');}});
  root.addEventListener('change',e=>{if(v1Change(e))return;if(e.target.name==='channel'){updateHistoryFields();return;}if(e.target.name==='historyFilter'){historyFilter=e.target.value;render();return;}if(e.target.name==='addressOrigin'){const label=root.querySelector('#origin-other');label.hidden=e.target.value!=='Sonstige';label.querySelector('input').required=e.target.value==='Sonstige';}});
  root.addEventListener('submit',e=>{e.preventDefault();if(busy)return;const form=e.target;if(form.elements.homepage)form.elements.homepage.value=normalizeHomepageInput(form.elements.homepage.value);if(!form.reportValidity())return;const input=Object.fromEntries(new FormData(form)),kind=form.dataset.form;
    if(kind==='project-search'){searchV1Projects(input.term);return;}
    if(kind==='edition-selection'){importSelectedV1Projects(form);return;}
    act(async()=>{let r;if(kind==='company'){r=await rpc('saveSalesTestCompany',input);selected='draft_'+r.id;detail=await rpc('getSalesCompany',selected);view='company';}
      if(kind==='history'){r=await rpc('saveSalesHistory',{...input,contactOn:input.channel==='Mail'?'':new Date(input.contactOn).toISOString(),draftId:formDraft.id});selected='draft_'+formDraft.id;detail=await rpc('getSalesCompany',selected);historyFilter='all';view='company';}
      if(kind==='change'){r=await rpc('saveSalesCompanyChange',{...input,draftId:formDraft.id});view='test';}
      if(kind==='edition')r=await rpc('saveSalesEditionSettings',{...input,editionId:state.edition.id,revision:state.edition.settings.revision});
      if(kind==='company-search'){companyResults=await rpc('searchSalesCompanies',input.term);r={message:'Unternehmensliste gelesen. Bitte gezielt auswählen.'};}
      if(kind==='access'){await rpc('saveSalesAccess',input.emails);r={message:'E-Mail-Freigaben gespeichert.'};}return r;},{reload:true,preserve:true});
  });
  // Refresh dashboards only; never interrupt a form or invoke HQ in the background.
  setInterval(()=>{if(!busy&&state&&view==='home')act(async()=>{state=await rpc('getSalesState');});},60000);
  act(async()=>{state=await rpc('getSalesState');});
  window.__salesStarted=true;
})();
</script></body></html>
