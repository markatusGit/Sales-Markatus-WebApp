<!doctype html>
<html lang="de"><head><meta charset="utf-8"><base target="_top"><title>Sales Markatus</title>
<!--DEMO_STYLES-->
<style>
body{margin:0;background:#111315;color:#f4f2ed;font-family:Arial,sans-serif}#magazin-vertrieb{max-width:1500px;margin:auto;min-height:100vh;border-radius:0}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}.m-nav button{min-height:42px}.m-data-table{display:block;overflow-x:auto}.m-data-table td{min-width:100px}.m-detail{white-space:pre-wrap;overflow-wrap:anywhere}.m-status{padding:12px 20px;border-bottom:1px solid var(--m-line)}.m-error{color:var(--m-warn)}.m-test-actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.m-value{overflow-wrap:anywhere}.m-jobs pre{max-height:300px;overflow:auto;white-space:pre-wrap}.m-check input{width:auto}.m-login{padding:40px}a{color:inherit}.m-form select{min-height:43px}#magazin-vertrieb input{background:var(--m-surface);color:var(--m-text);border:1px solid var(--m-line);border-radius:6px;padding:11px 12px;width:100%;min-width:0}#magazin-vertrieb .m-dl{grid-template-columns:minmax(110px,160px) minmax(0,1fr)}#magazin-vertrieb .m-dl dt{overflow-wrap:anywhere}@media(max-width:500px){#magazin-vertrieb .m-dl{grid-template-columns:1fr;gap:4px}#magazin-vertrieb .m-dl dd{margin-bottom:12px}}
details>summary{cursor:pointer;line-height:1.5;padding:8px 0}details[open]>summary{margin-bottom:8px}.m-plan{margin:12px 0;padding:12px;border:1px solid var(--m-line);border-radius:8px}.m-row h3,.m-plan,.m-row details{overflow-wrap:anywhere}.m-plan ul{padding-left:20px}.m-plan li{margin:6px 0}
</style></head><body><div id="magazin-vertrieb" data-theme="dark"><div class="m-login">Verbinde mit Firebase …</div></div>
<script>
(() => {
  'use strict';
  const root=document.getElementById('magazin-vertrieb');
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=c=>c===null||c===undefined?'Noch nicht hinterlegt':new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(c/100);
  const dateLabel=v=>/^\d{4}-\d{2}-\d{2}/.test(v||'')?v.slice(0,10).split('-').reverse().join('.'):'Datum nicht geliefert';
  const amountLabel=(c,currency)=>c===null||c===undefined?'Betrag nicht geliefert':currency?new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(c/100)+' '+currency+' netto':'Währung nicht geliefert';
  function historyRow(h){
    const dispatch=h.documentDispatch||h.contactHistoryChannel==='SentDocument';
    if(!dispatch)return `<div class="m-row"><h3>${esc(h.reason||h.contactHistoryChannel||'Kontakt')}</h3><small>${esc(dateLabel(h.contactOn))}</small><p class="m-detail">${esc(h.content)}</p></div>`;
    const invoice=h.invoice;
    return `<div class="m-row"><h3>${esc(h.projectName||'Projekt nicht zugeordnet')}</h3><p>${esc(dateLabel(h.contactOn))} · ${esc(invoice?amountLabel(invoice.netCents,invoice.currency):'Rechnung nicht eindeutig zugeordnet')}</p><details><summary>Versanddetails und E-Mail anzeigen</summary><p>${esc(h.reason||'Dokumentversand')}</p>${invoice?`<p>Beleg ${esc(invoice.number)} · Belegdatum ${esc(dateLabel(invoice.date))}</p>`:`<p class="m-muted">${h.documentMatch==='ambiguous'?'Mehrere passende Belege gefunden.':'Eine eindeutige Rechnungsnummer fehlt. Bitte mit HQ vergleichen.'}</p>`}<div class="m-detail">${esc(h.content)}</div></details></div>`;
  }
  function plannedRevenueRow(r){
    const intervals={Once:'einmalig',Monthly:'monatlich',Weekly:'wöchentlich',Fortnightly:'alle zwei Wochen',BiMonthly:'alle zwei Monate',QuarterAnnually:'vierteljährlich',HalfAnnually:'halbjährlich',Annually:'jährlich',TwoYears:'alle zwei Jahre',ThreeYears:'alle drei Jahre',FourYears:'alle vier Jahre',FiveYears:'alle fünf Jahre'};
    const projections=(r.estimations||[]).filter(e=>e.documentId===0&&['Planned','Deferred'].includes(e.status));
    const other=(r.estimations||[]).filter(e=>!(e.documentId===0&&['Planned','Deferred'].includes(e.status)));
    const active=['Planned','Deferred'].includes(r.status);
    const title=`<strong>${esc(r.description||'Planumsatz')}</strong><p>${esc(r.status||'Status nicht geliefert')} · ${esc(intervals[r.interval]||r.interval||'Intervall nicht geliefert')}</p>`;
    const dates=projections.map(e=>`<li>${esc(dateLabel(e.date))} · ${esc(amountLabel(e.cents,r.currency))}${e.status==='Deferred'?' · zurückgestellt':''}</li>`).join('');
    const fallback=`<p>Planbetrag: ${esc(amountLabel(r.netCents,r.currency))}</p><p>Planungsbeginn: ${esc(dateLabel(r.startDate))}${r.endDate?' · Ende: '+esc(dateLabel(r.endDate)):''}</p><p class="m-muted">${r.estimations===null?'HQ hat keine Terminaufteilung geliefert.':r.estimations?.length?'Keine offenen, eindeutig zugeordneten Plantermine geliefert.':'Keine Plantermine geliefert.'} Der Planungsbeginn ist kein bestätigter Rechnungstermin.</p>`;
    const explanation=other.length?`<details><summary>Weitere HQ-Planungsdaten (${other.length})</summary><p>Mit Beleg verknüpfte oder anders eingestufte Einträge zählen hier nicht zu den offenen Planterminen.</p><ul>${other.map(e=>`<li>${esc(dateLabel(e.date))} · ${esc(amountLabel(e.cents,r.currency))} · ${esc(e.status||'Status fehlt')}${e.documentId>0?' · Beleg-ID '+esc(e.documentId):e.documentId===null?' · Belegzuordnung fehlt':''}</li>`).join('')}</ul></details>`:'';
    const body=`${title}${dates?`<ul>${dates}</ul>`:fallback}${explanation}`;
    return active?`<div class="m-plan">${body}</div>`:`<details class="m-plan"><summary>${esc(r.description||'Planumsatz')} · ${esc(r.status||'Status nicht geliefert')} (nicht als offen bestätigt)</summary>${body}</details>`;
  }
  function projectRow(p){return `<div class="m-row"><h3>${esc(p.number)} · ${esc(p.name)}</h3><p>${esc(p.status)} · Fakturiert: ${money(p.revenueCents)} netto${p.complete?'':' · vorläufig'}</p>${p.completed||p.actualFinishDate?`<p>Abgeschlossen: ${esc(p.actualFinishDate?dateLabel(p.actualFinishDate):'Abschlussdatum von HQ nicht geliefert')}</p>`:`${p.plannedFinishDate?`<p>Geplanter Projektabschluss: ${esc(dateLabel(p.plannedFinishDate))}</p>`:''}<h4>Planumsätze</h4>${Array.isArray(p.plannedRevenues)?p.plannedRevenues.map(plannedRevenueRow).join('')||'<p>Keine Planumsätze von HQ geliefert.</p>':'<p>Bitte Firmendetails erneut importieren, um Abschlussdatum und Planumsätze zu laden.</p>'}`}</div>`;}
  let state=null,view='home',selected=null,detail=null,preview=null,busy=false,message='',error='',search='',theme='dark';
  try{theme=localStorage.getItem('sales-theme')==='light'?'light':'dark';}catch(_){}
  function rpc(name,...args){return new Promise((resolve,reject)=>{if(!window.google?.script?.run){reject(new Error('Diese Datei läuft als bereitgestellte Apps-Script-Web-App. Bitte die Google-Web-App-Adresse öffnen.'));return;}google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||'Anfrage fehlgeschlagen.')))[name](...args);});}
  const button=(label,action,id='',primary=false)=>`<button type="button" class="m-button ${primary?'m-primary':''}" data-action="${action}" data-id="${esc(id)}" ${busy?'disabled':''}>${esc(label)}</button>`;
  const tag=(text,type='')=>`<span class="m-tag ${type?'m-tag-'+type:''}">${esc(text)}</span>`;
  const head=(title,text='',actions='')=>`<div class="m-pagehead"><div><div class="m-eye">Sales Markatus</div><h1>${esc(title)}</h1><p>${esc(text)}</p></div><div class="m-actions">${actions}</div></div>`;
  const empty=text=>`<div class="m-empty">${esc(text)}</div>`;
  const field=(label,name,value='',type='text',required=false)=>`<label class="m-field">${esc(label)}<input name="${esc(name)}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'min="0" step="0.01"':''}></label>`;
  const select=(label,name,items,value='')=>`<label class="m-field">${esc(label)}<select name="${name}">${items.map(x=>`<option value="${esc(x.id)}" ${String(x.id)===String(value)?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>`;
  function companies(){return state?.edition?.companies||[];}
  function revenue(id){return (state?.edition?.documents||[]).filter(d=>!id||d.companyId===id).reduce((sum,d)=>sum+d.cents,0);}
  function addr(c){return c.defaultAddress||c.addresses?.find(a=>a.standardForDocumentType==='Invoice')||null;}
  function customerRows(){const q=search.toLocaleLowerCase('de');return companies().filter(c=>[c.name,addr(c)?.city,c.industrialSector].some(x=>(x||'').toLocaleLowerCase('de').includes(q))).map(c=>`<div class="m-listitem"><div><h3><button class="m-link" data-action="company" data-id="${esc(c.id)}">${esc(c.name)}</button></h3><p>${esc([addr(c)?.city,c.industrialSector].filter(Boolean).join(' · '))}</p><div class="m-tags">${tag('HQ · nur lesen')}${c.companyTypes.map(t=>tag(t.name)).join('')}</div></div><div class="m-list-end"><strong>${money(revenue(c.id))}</strong><small>Ausgabe #70${state.edition.complete?'':' · vorläufig'}</small></div></div>`).join('')||empty('Noch keine passenden Kunden. Zuerst Ausgabe #70 auf der Testseite importieren.');}
  function home(){const e=state.edition;return head('Mein Tag','Gemeinsamer Datenstand aus Firebase',button('Frisch aus Firebase laden','reload'))+`<div class="m-summaries"><div class="m-summary"><span>Kunden im Lesepilot</span><b>${companies().length}</b><small>COBURGER #70</small></div><div class="m-summary"><span>Fakturierter Netto-Umsatz #70</span><b>${e?money(revenue()):'—'}</b><small>${!e?'Noch nicht importiert':e.complete?'Gemäß gewählten Belegstatus':'Vorläufig · Hinweise prüfen'}</small></div><div class="m-summary"><span>Offene Übertragungen</span><b>${state.jobs.filter(j=>!['synced','canceled'].includes(j.state)).length}</b><small>Nur eigene Testfirmen</small></div></div>${e?.changes?.length?`<div class="m-note">Ausgabe aktualisiert: Ziel ${money(e.changes[0].before.targetCents)} → ${money(e.settings.targetCents)} · ${esc(new Date(e.changes[0].at).toLocaleString('de-DE'))}</div>`:''}<div class="m-columns m-section"><section class="m-panel"><div class="m-panel-head"><h2>COBURGER · Ausgabe #70</h2></div><div class="m-panel-body"><dl class="m-dl"><dt>Zielumsatz</dt><dd>${money(e?.settings.targetCents)}</dd><dt>Anzeigenschluss</dt><dd>${esc(e?.settings.adDeadline||'Noch offen')}</dd><dt>Drucktermin</dt><dd>${esc(e?.settings.printDate||'Noch offen')}</dd><dt>Veröffentlichung</dt><dd>${esc(e?.settings.releaseDate||'Noch offen')}</dd></dl></div></section><section class="m-panel"><div class="m-panel-head"><h2>Nächster Test</h2></div><div class="m-panel-body"><p>Firebase abfragen, den HQ-Import bewusst starten und danach wieder aus Firebase lesen.</p><div class="m-test-actions">${button('Testseite öffnen','nav','test',true)}</div><p class="m-muted">Dies ist eine historische Pilotausgabe. Aktuelle Ausgaben werden anschließend ergänzt.</p></div></section></div>`;}
  function customerList(){return head('Kunden','Lesepilot aus COBURGER #70. Eigene Schreibtestfirmen liegen separat.',button('Testfirma anlegen','nav','new',true))+`<label class="m-field">Kunden suchen<input id="search" value="${esc(search)}" placeholder="Unternehmen, Ort oder Branche"></label><section id="customer-rows" class="m-panel m-section">${customerRows()}</section>`;}
  function company(){const c=detail?.company||companies().find(c=>c.id===selected);if(!c)return empty('Firma fehlt.');const a=addr(c);return head(c.name,'HQ-Daten werden hier ausschließlich gelesen.',button('Zur Kundenliste','nav','customers'))+`<div class="m-test-actions">${button('1 · Firebase abfragen','read-company',c.id)}${state.user.admin?button('2 · Details HQ → Firebase','sync-company',c.id):''}${button('3 · Erneut aus Firebase lesen','read-company',c.id)}</div>${!detail?'<div class="m-note">Firmendetails noch nicht nach Firebase übertragen. Die Grunddaten stammen aus dem Ausgabeimport.</div>':''}<section class="m-panel m-section"><div class="m-panel-head"><h2>Allgemein</h2>${tag('Nur lesen')}</div><div class="m-panel-body"><dl class="m-dl"><dt>Kundennummer</dt><dd>${esc(c.companyTypes.map(t=>t.number).filter(Boolean).join(', ')||'Nicht hinterlegt')}</dd><dt>Branche</dt><dd>${esc(c.industrialSector||'Nicht hinterlegt')}</dd><dt>Verantwortlich</dt><dd>${esc(c.responsibleUsers.map(u=>[u.firstName,u.lastName].filter(Boolean).join(' ')).join(', ')||'Nicht hinterlegt')}</dd><dt>Homepage</dt><dd class="m-value">${esc(c.homepageDisplay||c.homepage||'Von HQ nicht geliefert')}${c.homepageSource&&c.homepageSource!=='Firma'?'<br><small>'+esc(c.homepageSource)+'</small>':''}</dd><dt>Adresse</dt><dd>${a?esc([a.street,a.houseNumber,a.zipCode,a.city,a.country].filter(Boolean).join(' ')):'Nicht hinterlegt'}<br><small>${c.defaultAddress?'Standardadresse':a?'Rechnungsadresse':'Keine Adresse'}</small></dd><dt>Beschreibung</dt><dd class="m-detail">${esc(c.description||'Nicht hinterlegt')}</dd>${['Kundenklassifizierung','Kundenherkunft','Adressherkunft'].map(name=>`<dt>${name}</dt><dd>${esc(c.customFields.find(f=>f.name===name)?.value||'Nicht hinterlegt')}</dd>`).join('')}</dl></div></section><section class="m-panel m-section"><div class="m-panel-head"><h2>Ansprechpartner</h2></div>${(detail?.contacts||[]).map(p=>`<div class="m-row"><h3>${esc([p.salutation,p.firstName,p.lastName].filter(Boolean).join(' '))}</h3><p>${esc(p.position||'')}</p><p>${esc(p.eMail||'Keine E-Mail')} · Mobil: ${esc(p.phoneMobile||'—')} · Festnetz: ${esc(p.phoneLandline||'—')}</p></div>`).join('')||empty(detail?'Keine Ansprechpartner vorhanden.':'Noch nicht importiert.')}</section><section class="m-panel m-section"><div class="m-panel-head"><h2>Kontakt-Historie</h2></div>${(detail?.histories||[]).slice().sort((a,b)=>(b.contactOn||'').localeCompare(a.contactOn||'')).map(historyRow).join('')||empty(detail?'Keine Historieneinträge vorhanden.':'Noch nicht importiert.')}</section><section class="m-panel m-section"><div class="m-panel-head"><h2>Projekte</h2></div>${(detail?.projects||[]).map(projectRow).join('')||empty(detail?'Keine direkt zugeordneten Projekte vorhanden.':'Noch nicht importiert.')}</section>`;}
  function magazine(){return head('Magazinverkauf','COBURGER · Ausgabe #70')+`<div class="m-note">Die Historie umfasst bisher nur diese Ausgabe. Filter über die letzte oder die letzten fünf Ausgaben werden erst nach deren vollständigem Import freigegeben.</div><div class="m-filterbar m-section"><label class="m-field">Magazin<select><option>Coburger</option></select></label><label class="m-field">Ausgabe<select><option>#70 · Lesepilot</option></select></label></div><section class="m-panel">${customerRows()}</section>`;}
  function invoices(){const e=state.edition;return head('Buchungshistorie','Rechnungen aus HQ · keine Bearbeitung von Rechnungen oder Projekten')+`<section class="m-panel">${(e?.documents||[]).map(d=>`<div class="m-row"><h3>${esc(companies().find(c=>c.id===d.companyId)?.name||'Empfänger fehlt')}</h3><p>${esc(d.number)} · ${esc(d.date)} · ${esc(d.type)} · ${esc(d.status)} · ${money(d.cents)}</p></div>`).join('')||empty('Noch keine Belege importiert.')}</section>${e?.issues?.length?`<section class="m-panel m-section"><div class="m-panel-head"><h2>Prüfhinweise</h2></div>${e.issues.map(i=>`<div class="m-row">HQ-Beleg ${esc(i.id)}: ${esc(i.reason)}</div>`).join('')}</section>`:''}`;}
  function test(){return head('Datenwege testen','Jeder Lesezugriff der App kommt aus Firebase.')+`<section class="m-panel"><div class="m-panel-head"><h2>COBURGER #70 · nur lesen</h2>${tag(state.edition?'Import vorhanden':'Noch nicht importiert')}</div><div class="m-panel-body"><p>1. Firebase abfragen. 2. HQ-Daten übertragen. 3. Firebase erneut abfragen.</p><div class="m-test-actions">${button('1 · Firebase abfragen','reload')}${state.user.admin?button('2 · Ausgabe HQ → Firebase','sync-edition','',true):''}${button('3 · Erneut aus Firebase lesen','reload')}</div><p>Stand: ${esc(state.edition?.loadedAt?new Date(state.edition.loadedAt).toLocaleString('de-DE'):'Noch kein Ausgabeimport')} · ${companies().length} Unternehmen</p><p class="m-muted">Ansprechpartner, Historie und Projektübersicht können danach je Kunde über dessen Detailansicht übertragen werden.</p></div></section><section class="m-panel m-section"><div class="m-panel-head"><h2>HQ-Auswahllisten</h2></div><div class="m-panel-body"><p>Verantwortliche Benutzer, Firmenarten und HQ-Unternehmensbereiche für die sichere Testanlage.</p><div class="m-test-actions">${state.user.admin?button('Auswahllisten HQ → Firebase','sync-catalog'):''}${button('Firebase erneut abfragen','reload')}</div><p>${state.catalog?state.catalog.users.length+' Benutzer · '+state.catalog.types.length+' Firmenarten · '+state.catalog.subsystems.length+' Bereiche':'Noch nicht importiert'}</p></div></section><section class="m-panel m-section"><div class="m-panel-head"><h2>Schreiben · nur eigene Testfirmen</h2>${button('Testfirma anlegen','nav','new',true)}</div><div class="m-panel-body"><p>Die Eingabe wird zuerst in Firebase gespeichert. Anschließend den Auftrag ansehen und die Übertragung bewusst starten. Echte Kunden aus Ausgabe #70 sind als Schreibziele gesperrt.</p></div>${state.drafts.map(d=>`<div class="m-row"><h3>${esc(d.company.name)}</h3><p>${esc(d.kind)} · ${d.hqId?'HQ-ID '+esc(d.hqId):'Noch ohne bestätigte HQ-ID'} · Adressherkunft: ${esc(d.addressOrigin==='Sonstige'?d.addressOriginOther:d.addressOrigin||'Nicht hinterlegt')}</p><div class="m-test-actions">${d.hqId?button('Kontakt erfassen','history-form',d.id)+button('Änderung testen','change-form',d.id)+button('Firmendetails','company',String(d.hqId)):''}</div></div>`).join('')}</section>${jobs()}`;}
  function jobs(){const names={pending:'Bereit zur Prüfung',running:'Übertragung läuft / Ausgang prüfen',ready:'Fortsetzung vorbereitet',synced:'Bestätigt',uncertain:'Ausgang unklar',conflict:'Konflikt',canceled:'Verworfen'};return `<section class="m-panel m-section m-jobs"><div class="m-panel-head"><h2>Synchronisationsaufträge</h2></div>${state.jobs.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(j=>`<div class="m-row"><h3>${esc(j.name)} ${tag(names[j.state]||j.state,j.state==='synced'?'good':'warn')}</h3><p>${esc(j.message)}</p><div class="m-test-actions">${button('Auftrag ansehen','preview',j.id)}${state.user.admin&&['running','uncertain'].includes(j.state)?button('Ergebnis nur in HQ prüfen','reconcile',j.id):''}</div>${j.conflict?`<pre>${esc(JSON.stringify(j.conflict,null,2))}</pre>${state.user.admin?button('HQ-Werte behalten','conflict-hq',j.id)+button('App-Werte verwenden','conflict-app',j.id):''}`:''}</div>`).join('')||empty('Noch keine Aufträge vorhanden.')}</section>`;}
  function previewPage(){if(!preview)return empty('Kein Auftrag ausgewählt.');return head('Schreibauftrag prüfen','Ziel und Werte prüfen, bevor HQ verändert wird.',button('Zur Testseite','nav','test'))+`<section class="m-panel m-jobs"><div class="m-panel-body"><div class="m-note">${esc(preview.note)}</div><h2 class="m-section">${esc(preview.job.name)}</h2><p>HQ-ID: ${esc(preview.job.hqId||'Wird bei Neuanlage vergeben')} · Status: ${esc(preview.job.state)}</p><pre>${esc(JSON.stringify(preview.change||preview.history||{company:preview.company,contact:preview.contact},null,2))}</pre><p>Adressherkunft: ${esc(preview.addressOrigin==='Sonstige'?preview.addressOriginOther:preview.addressOrigin||'Nicht hinterlegt')} (nur Firebase)</p><div class="m-test-actions">${state.user.admin&&['pending','ready'].includes(preview.job.state)?button('Jetzt nach HQ übertragen und prüfen','run-job',preview.job.id,true):''}</div></div></section>`;}
  function newCompany(){const cat=state.catalog;if(!cat)return head('Testfirma anlegen')+empty('Zuerst auf der Testseite die HQ-Auswahllisten importieren und Firebase erneut laden.');return head('Eigene Testfirma anlegen','Standard: Interessent. Speicherung zuerst in Firebase.')+`<section class="m-panel"><div class="m-panel-body"><form data-form="company" class="m-form">${field('Firmenname (beginnt mit TEST)','name','TEST ', 'text',true)}${select('Firmenart','kind',[{id:'Interessent',name:'Interessent'},{id:'Kunde',name:'Kunde'}],'Interessent')}${field('Branche','industrialSector')}${select('Verantwortlicher HQ-Benutzer','responsibleUserId',[{id:'',name:'Bitte auswählen'},...cat.users])}${select('HQ-Unternehmensbereich','subsystemId',[{id:'',name:'Bitte auswählen'},...cat.subsystems])}${field('Homepage','homepage','','url')}<label class="m-field m-full">Beschreibung<textarea name="description" maxlength="5000"></textarea></label>${field('Straße','street','','text',true)}${field('Hausnummer','houseNumber')}${field('Postleitzahl','zipCode','','text',true)}${field('Ort','city','','text',true)}${field('Land (Code)','country','DE','text',true)}${select('Adressherkunft','addressOrigin',['','Wirtschaftsclub Bamberg','Logan Five','Sonstige'].map(x=>({id:x,name:x||'Bitte auswählen'})))}<label class="m-field" id="origin-other" hidden>Sonstige Adressherkunft<input name="addressOriginOther" maxlength="200"></label>${cat.fields.filter(f=>['Kundenklassifizierung','Kundenherkunft'].includes(f.name)).map(f=>field(f.name,f.name)).join('')}<h2 class="m-full">Erster Ansprechpartner (optional)</h2>${field('Vorname','firstName')}${field('Nachname','lastName')}${field('Position','position')}${field('Anrede','salutation')}${field('E-Mail','eMail','','email')}${field('Mobiltelefon','phoneMobile')}${field('Festnetztelefon','phoneLandline')}<div class="m-note m-full">Nur für selbst angelegte Testfirmen. HQ-Schreibzugriffe auf vorhandene Kunden aus Ausgabe #70 bleiben gesperrt.</div><div class="m-full"><button class="m-button m-primary" ${busy?'disabled':''}>In Firebase speichern</button></div></form></div></section>`;}
  let formDraft=null;
  function historyForm(){return head('Kontakt erfassen',formDraft?.company.name||'')+`<section class="m-panel"><div class="m-panel-body"><form data-form="history" class="m-form">${field('Betreff','reason','','text',true)}${select('Kontaktart','channel',[{id:'Note',name:'Notiz'},{id:'Call',name:'Telefonat'},{id:'Meeting',name:'Besprechung'},{id:'Visit',name:'Besuch'}])}<label class="m-field m-full">Notiz<textarea name="content" required maxlength="10000"></textarea></label><div class="m-full"><button class="m-button m-primary" ${busy?'disabled':''}>In Firebase speichern</button></div></form></div></section>`;}
  function changeForm(){return head('Änderung testen',formDraft?.company.name||'')+`<div class="m-note">Erster Änderungstest: Branche und Homepage. HQ wird vor dem Schreiben mit dem zuletzt importierten Firebase-Stand verglichen. Weitere Stammdatenänderungen folgen nach Prüfung dieses Weges.</div><section class="m-panel m-section"><div class="m-panel-body"><form data-form="change" class="m-form">${field('Branche','industrialSector',detail?.company.industrialSector||'')}${field('Homepage','homepage',detail?.company.homepage||'','url')}<button class="m-button m-primary" ${busy?'disabled':''}>Änderung in Firebase speichern</button></form></div></section>`;}
  function admin(){const e=state.edition,s=e?.settings;return head('Verwaltung','Ausgabeziele, Termine und Zugang')+`<section class="m-panel"><div class="m-panel-head"><h2>COBURGER #70 · Ziel und Termine</h2></div><div class="m-panel-body">${s?`<form data-form="edition" class="m-form">${field('Zielumsatz netto (€)','target',s.targetCents===null?'':s.targetCents/100,'number',true)}${field('Anzeigenschluss','adDeadline',s.adDeadline,'date')}${field('Drucktermin','printDate',s.printDate,'date')}${field('Veröffentlichungsdatum','releaseDate',s.releaseDate,'date')}<div class="m-full"><button class="m-button m-primary" ${busy?'disabled':''}>Für alle in Firebase speichern</button></div></form>`:'Zuerst die Ausgabe importieren.'}</div></section>${state.user.admin?`<section class="m-panel m-section"><div class="m-panel-head"><h2>Freigegebene E-Mail-Adressen</h2></div><div class="m-panel-body"><form data-form="access"><label class="m-field">Eine Adresse pro Zeile<textarea name="emails" required>${esc(state.access.emails.join('\n'))}</textarea></label><p class="m-muted">Nur diese Konten erhalten Zugriff. Deine Administratoradresse bleibt freigegeben. Die Freigabe sendet keine E-Mail.</p><button class="m-button m-primary" ${busy?'disabled':''}>Freigaben speichern</button></form></div></section>`:''}`;}
  const nav=[['home','Mein Tag'],['magazine','Magazinverkauf'],['customers','Kunden'],['contacts','Ansprechpartner'],['invoices','Buchungshistorie'],['reminders','Wiedervorlagen'],['test','Daten-Testseite'],['admin','Verwaltung']];
  function render(){root.dataset.theme=theme;if(!state){root.innerHTML=`<div class="m-login"><h1>Sales Markatus</h1><p>${esc(error||'Lade Firebase-Daten …')}</p>${error?button('Erneut versuchen','reload'):''}</div>`;return;}
    const pages={home,customers:customerList,company,magazine,invoices,test,preview:previewPage,new:newCompany,history:historyForm,change:changeForm,admin,contacts:()=>head('Ansprechpartner','Alle importierten Ansprechpartner stehen in der jeweiligen Kundenansicht.')+`<section class="m-panel">${companies().map(c=>`<div class="m-row">${button(c.name,'company',c.id)}</div>`).join('')||empty('Noch keine Unternehmen importiert.')}</section>`,reminders:()=>head('Wiedervorlagen')+empty('Die gemeinsame Wiedervorlagenverwaltung wird nach dem ersten Kontakt-Historien-Test angebunden.')};
    root.innerHTML=`<div class="m-top"><strong>MARKATUS · SALES</strong><div class="m-actions"><small>${esc(state.user.email)}</small>${button(theme==='dark'?'Helle Ansicht':'Dunkle Ansicht','theme')}</div></div><div class="m-status ${error?'m-error':''}" role="status" aria-live="polite">${esc(error||message||'Firebase-Daten geladen.')} ${busy?'Bitte warten …':''}</div><div class="m-layout"><aside class="m-side"><div class="m-nav-title">Magazinvertrieb</div><nav class="m-nav">${nav.map(([id,label])=>`<button type="button" data-action="nav" data-id="${id}" aria-current="${view===id?'page':'false'}" ${busy?'disabled':''}>${label}</button>`).join('')}</nav><div class="m-side-bottom"><p>Pilot · COBURGER #70<br>Lesedaten aus HQ<br>Schreibtests separat</p></div></aside><main class="m-main">${(pages[view]||home)()}</main></div><footer class="m-footer"><span>Apps Script · Firebase · HQ</span><span>${state.edition?'HQ-Import '+esc(new Date(state.edition.loadedAt).toLocaleString('de-DE')):'Noch kein Ausgabeimport'}</span></footer>`;
  }
  async function act(fn,{reload=false,preserve=false}={}){if(busy)return;busy=true;error='';if(preserve){root.querySelectorAll('button').forEach(b=>b.disabled=true);}else render();try{const result=await fn();if(result?.message)message=result.message;if(reload)state=await rpc('getSalesState');}catch(e){error=e.message;if(preserve){busy=false;root.querySelectorAll('button').forEach(b=>b.disabled=false);const status=root.querySelector('.m-status');if(status){status.textContent=error;status.classList.add('m-error');}return;}}finally{busy=false;}render();}
  root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||busy)return;const a=b.dataset.action,id=b.dataset.id;if(a==='theme'){theme=theme==='dark'?'light':'dark';root.dataset.theme=theme;b.textContent=theme==='dark'?'Helle Ansicht':'Dunkle Ansicht';try{localStorage.setItem('sales-theme',theme);}catch(_){}return;}if(a==='nav'){view=id;search='';message='';error='';render();return;}
    if(a==='reload')return act(async()=>{state=await rpc('getSalesState');return {message:'Frisch aus Firebase geladen. Kein HQ-Aufruf.'};});
    if(a==='company')return act(async()=>{selected=id;detail=await rpc('getSalesCompany',id);view='company';});
    if(a==='read-company')return act(async()=>{detail=await rpc('getSalesCompany',id);return {message:detail?'Firmendetails aus Firebase geladen.':'Noch keine Firmendetails in Firebase. Bitte den Detailimport starten.'};});
    if(a==='sync-company')return act(()=>rpc('syncSalesCompany',id));
    if(a==='sync-edition')return act(()=>rpc('syncSalesEdition'));
    if(a==='sync-catalog')return act(()=>rpc('syncSalesCatalog'));
    if(a==='preview')return act(async()=>{preview=await rpc('getSalesJobPreview',id);view='preview';});
    if(a==='run-job')return act(async()=>{const r=await rpc('runSalesJob',id);preview=await rpc('getSalesJobPreview',id);return r;},{reload:true});
    if(a==='reconcile')return act(()=>rpc('reconcileSalesJob',id),{reload:true});
    if(a==='conflict-hq'||a==='conflict-app')return act(()=>rpc('resolveSalesConflict',id,a==='conflict-hq'?'hq':'app'),{reload:true});
    if(a==='history-form'){formDraft=state.drafts.find(d=>d.id===id);view='history';render();return;}
    if(a==='change-form')return act(async()=>{formDraft=state.drafts.find(d=>d.id===id);detail=await rpc('getSalesCompany',formDraft.hqId);if(!detail)throw new Error('Zuerst Firmendetails importieren.');view='change';});
  });
  root.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;root.querySelector('#customer-rows').innerHTML=customerRows();}});
  root.addEventListener('change',e=>{if(e.target.name==='addressOrigin'){const label=root.querySelector('#origin-other');label.hidden=e.target.value!=='Sonstige';label.querySelector('input').required=e.target.value==='Sonstige';}});
  root.addEventListener('submit',e=>{e.preventDefault();if(busy)return;const form=e.target;if(!form.reportValidity())return;const input=Object.fromEntries(new FormData(form)),kind=form.dataset.form;
    act(async()=>{let r;if(kind==='company'){r=await rpc('saveSalesTestCompany',input);preview=await rpc('getSalesJobPreview',r.id);view='preview';}
      if(kind==='history'){r=await rpc('saveSalesHistory',{...input,draftId:formDraft.id});view='test';}
      if(kind==='change'){r=await rpc('saveSalesCompanyChange',{...input,draftId:formDraft.id});view='test';}
      if(kind==='edition')r=await rpc('saveSalesEditionSettings',{...input,revision:state.edition.settings.revision});
      if(kind==='access'){await rpc('saveSalesAccess',input.emails);r={message:'E-Mail-Freigaben gespeichert.'};}return r;},{reload:true,preserve:true});
  });
  // Refresh dashboards only; never interrupt a form or invoke HQ in the background.
  setInterval(()=>{if(!busy&&state&&view==='home')act(async()=>{state=await rpc('getSalesState');});},60000);
  act(async()=>{state=await rpc('getSalesState');});
})();
</script></body></html>
