/* Customer workspace: independent detail/history scrolling; capture stays visible. */
#magazin-vertrieb [hidden]{display:none!important}
body.sales-customer-open{padding:0;height:100dvh;overflow:hidden}
#magazin-vertrieb.m-customer-open{height:100dvh;min-height:0;display:flex;flex-direction:column}
#magazin-vertrieb.m-customer-open .m-layout{flex:1;min-height:0;overflow:hidden}
#magazin-vertrieb.m-customer-open .m-side{overflow:auto}
#magazin-vertrieb.m-customer-open .m-main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;padding:18px}
#magazin-vertrieb .m-customer-workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,1fr);gap:20px;flex:1;min-height:0}
#magazin-vertrieb .m-customer-details{overflow:auto;min-height:0;padding-right:10px;overscroll-behavior:contain}
#magazin-vertrieb .m-customer-details .m-pagehead{margin-bottom:18px}
#magazin-vertrieb .m-communication-column{min-height:0;display:flex;min-width:0}
#magazin-vertrieb .m-communication{display:flex;flex-direction:column;min-height:0;min-width:0;flex:1;box-shadow:0 5px 24px #0002}
#magazin-vertrieb .m-capture{padding:16px 18px;border-bottom:1px solid var(--m-line);flex:none}
#magazin-vertrieb .m-capture h2{font-size:1.12em;margin:0 0 4px}
#magazin-vertrieb .m-customer-label{font-size:.82em;margin-bottom:12px;overflow-wrap:anywhere}
#magazin-vertrieb .m-capture-fields{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;margin-bottom:12px}
#magazin-vertrieb .m-capture textarea{height:clamp(65px,11vh,125px);min-height:55px;max-height:22vh;resize:vertical}
#magazin-vertrieb .m-capture-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
#magazin-vertrieb .m-history-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
#magazin-vertrieb .m-history-scroll>.m-section{margin-top:0;border:0;box-shadow:none}

#magazin-vertrieb .m-history-scroll .m-panel-body>.m-muted{margin-top:8px;font-size:.76em}
#magazin-vertrieb .m-history-toolbar{position:sticky;top:0;z-index:1;background:var(--m-surface);border-bottom:1px solid var(--m-line)}
#magazin-vertrieb .m-history-filters{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:8px}
#magazin-vertrieb .m-history-filters select{min-width:0;width:100%}
#magazin-vertrieb .m-history-toolbar .m-test-actions:not(:empty){margin-top:8px}
#magazin-vertrieb .m-customer-tabs{display:none}
#magazin-vertrieb .m-contact-dialog{background:var(--m-surface);color:var(--m-text);border:1px solid var(--m-line);border-radius:10px;padding:24px;width:min(540px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto}
#magazin-vertrieb .m-contact-dialog::backdrop{background:#0009}
#magazin-vertrieb .m-contact-dialog .m-form{gap:12px;margin:18px 0}

@media(max-width:1050px){

function salesPermissions_(input,owner=false){
  if(input!==undefined&&(!input||typeof input!=='object'||Array.isArray(input)))throw Error('Ungültige Rechte.');
  const known=new Set(SALES_PERMISSION_CATALOG.map(p=>p[0]));
  for(const [key,value] of Object.entries(input||{}))if(!known.has(key)||typeof value!=='boolean')throw Error('Unbekanntes oder ungültiges Recht: '+key);
  const out=Object.fromEntries(SALES_PERMISSION_CATALOG.map(([key])=>[key,owner||SALES_PERMISSION_BASE.includes(key)||input?.[key]===true]));
  for(const [write,read] of [['sync.run','sync.read'],['settings.edit','settings.read'],['company.create','company.read'],['company.edit','company.read'],['contact.create','contact.read'],['contact.edit','contact.read'],['communication.create','communication.read']])if(out[write])out[read]=true;

}

  function historySelection(editions,current,mode){
    if(mode==='all')return {ids:null,message:''};if(!current)return {ids:new Set(),unknown:true,message:'Zuerst eine Ausgabe auswählen.'};
    if(Number(current.issue)<=(mode==='last5'?5:1))return {ids:new Set(),unknown:true,message:'Für diese Ausgabe gibt es noch nicht genügend vorherige Ausgaben für diesen Filter.'};
    const same=editions.filter(e=>e.magazine.toLocaleLowerCase('de')===current.magazine.toLocaleLowerCase('de'));
    const required=mode==='last5'?[1,2,3,4,5].map(n=>Number(current.issue)-n):[Number(current.issue)-1];
    const missing=required.filter(n=>!same.some(e=>Number(e.issue)===n&&e.loadedAt&&e.complete));
    if(missing.length)return {ids:new Set(),unknown:true,message:'Noch nicht auswertbar: '+current.magazine+' #'+missing.join(', #')+' fehlt oder ist unvollständig. Keine fehlende Buchung wird daraus abgeleitet.'};
    const booked=e=>{const sums=e.companyRevenue||{};if(!e.companyRevenue)(e.documents||[]).forEach(d=>{sums[d.companyId]=(sums[d.companyId]||0)+d.cents;});return Object.keys(sums).filter(id=>sums[id]>0);};
    if(mode==='last5')return {ids:new Set(same.filter(e=>required.includes(Number(e.issue))).flatMap(booked)),message:'Mindestens einmal mit positivem Netto-Rechnungsbetrag in den fünf Ausgaben vor #'+current.issue+'.'};
    const last=new Set(booked(same.find(e=>Number(e.issue)===Number(current.issue)-1))),earlier=same.filter(e=>Number(e.issue)<Number(current.issue)-1&&e.loadedAt);
    if(!earlier.length)return {ids:new Set(),unknown:true,message:'Noch keine frühere Ausgabe vor der letzten Ausgabe importiert.'};
    return {ids:new Set(earlier.flatMap(booked).filter(id=>!last.has(id))),message:'Nicht in #'+(Number(current.issue)-1)+', aber früher fakturiert. Frühere Historie umfasst ausschließlich die importierten Ausgaben: '+earlier.map(e=>'#'+e.issue).join(', ')+'.'};

  async function continueV1Import(editionsOnly=false){
    if(importLoop)return;importLoop=true;stopImport=false;
    try{
      await act(async()=>{state.syncRun=await rpc(editionsOnly?'startSalesEditionRefresh':'startSalesSync');});if(error)return;
      if(state.syncRun?.engine===2){view='import';message=(editionsOnly?'Ausgabenverknüpfung':'HQ-Sync')+' bei Google gestartet. Der Browser muss nicht geöffnet bleiben.';return;}
      while(!stopImport&&state.syncRun?.state==='running'&&!state.syncRun.paused){await act(async()=>{state.syncRun=await rpc('runSalesSyncStep',state.syncRun.id,state.syncRun.revision);});if(error)break;}
      if(stopImport&&state.syncRun?.state==='running'&&!error)await act(async()=>{state.syncRun=await rpc('pauseSalesSync',state.syncRun.id);});
      const failure=error;await act(async()=>{loadedViews.clear();viewCache.clear();companyCache.clear();editionCache.clear();return {message:failure?'HQ-Sync unterbrochen: '+failure:state.syncRun?.paused?'HQ-Sync angehalten; später fortsetzbar.':state.syncRun?.state==='completed'?'HQ-Sync abgeschlossen.':'HQ-Sync mit offenen Punkten beendet. Bitte Hinweise prüfen.'};});
    }finally{importLoop=false;render();}
  }

  async function searchV1Projects(term){
    projectSearchTerm=term.trim();projectSearchError='';projectSearching=true;projectResults={rows:[],limited:true};projectChoices={};
    await act(async()=>{
      try{
        const seen=new Set();let skip=0;
        for(let page=0;page<50;page++){
          const result=await rpc('searchSalesProjects',projectSearchTerm,skip);
          if(!result||!Array.isArray(result.rows))throw new Error('HQ-Projektsuche hat kein gültiges Ergebnis geliefert.');
          for(const row of result.rows){if(seen.has(String(row.id)))throw new Error('HQ-Suchseiten enthalten doppelte Projekte. Bitte erneut suchen.');seen.add(String(row.id));projectResults.rows.push(row);}
          projectResults.limited=!!result.limited;render();
          if(!result.limited)break;
          if(!Number.isSafeInteger(result.nextSkip)||result.nextSkip<=skip)throw new Error('HQ-Suchseite konnte nicht fortgesetzt werden.');
          skip=result.nextSkip;
        }
        return {message:projectResults.rows.length+' Projekte gefunden. Ergebnisse stehen direkt unter der Suche.'};
      }catch(e){projectSearchError='Projektsuche fehlgeschlagen: '+e.message;throw new Error(projectSearchError);}

    });

  function salesPermissionFields(values={},owner=false){return SALES_PERMISSION_CATALOG.map(([key,label,group],i)=>'<label class="m-check"><input type="checkbox" name="permission:'+key+'" '+(values[key]||SALES_PERMISSION_BASE.includes(key)?'checked':'')+' '+(owner||SALES_PERMISSION_BASE.includes(key)?'disabled':'')+'>'+esc(label)+'</label>').join('');}
  function salesUsersPanel(){
    const users=salesUserRows.map(u=>'<details class="m-row"><summary>'+esc(u.email)+' · '+(u.status==='active'?'Aktiv':'Gesperrt')+'</summary><form data-form="auth-user" data-uid="'+esc(u.uid)+'" data-revision="'+u.revision+'">'+salesPermissionFields(u.permissions,u.uid===state.user.uid)+'<label class="m-field">Zugang<select name="status" '+(u.uid===state.user.uid?'disabled':'')+'><option value="active" '+(u.status==='active'?'selected':'')+'>Aktiv</option><option value="disabled" '+(u.status==='disabled'?'selected':'')+'>Gesperrt</option></select></label><button class="m-button" '+(u.uid===state.user.uid?'disabled':'')+'>Rechte speichern</button></form></details>').join('');
    return '<section class="m-panel m-section"><div class="m-panel-head"><h2>Benutzer und Rechte</h2>'+button('Benutzer laden','auth-users')+'</div><div class="m-panel-body"><form data-form="auth-invite"><h3>Benutzer freigeben</h3>'+field('E-Mail-Adresse','email','','email',true)+salesPermissionFields()+'<p class="m-muted">Neue Benutzer lesen zunächst nur Mein Tag und Kunden. Löschen sowie noch nicht vorhandene Funktionen bleiben gesperrt.</p><button class="m-button m-primary">Einladungslink erstellen</button></form>'+(salesInvitationLink?'<label class="m-field">Einladungslink · 48 Stunden gültig<input readonly data-invitation-link value="'+esc(salesInvitationLink)+'"></label>'+button('Einladungslink kopieren','auth-copy'):'')+'</div>'+users+(salesUserCursor?button('Weitere Benutzer','auth-more'):'')+'</section>';
  }
  function salesUiPermissions(){
    if(!salesUsesLogin()||!state)return;
    const navRules={home:'home.read',customers:'customers.read',magazine:'magazine.read',contacts:'directory.read',invoices:'finance.read',import:'sync.read',admin:'settings.read',reminders:'unavailable',test:'owner',new:'company.create',change:'company.edit'};
    for(const b of root.querySelectorAll('[data-action="nav"]')){const rule=navRules[b.dataset.id];if(rule&&!salesCan(rule)&&!(b.dataset.id==='admin'&&state.user.admin))b.hidden=true;}
    const actionRules={'edit-business':'company.edit','v1-sync':'sync.run','pause-import':'sync.run','v1-editions':'owner','project-search':'settings.edit','exclude-document':'owner','include-document':'owner','preview':'sync.read','inventory-start':'owner','inventory-next':'owner','sync-company':'sync.run','sync-history':'sync.run','unassigned':'sync.read'};
    for(const b of root.querySelectorAll('[data-action]')){
      let rule=actionRules[b.dataset.action];if(b.dataset.action==='edit-business'&&b.dataset.id.startsWith('contact:'))rule='contact.edit';
      if(rule&&(rule==='owner'?!state.user.admin:!salesCan(rule)))b.hidden=true;
    }
    const capture=root.querySelector('.m-capture');if(capture&&!salesCan('communication.create'))capture.innerHTML='<h2>Kommunikation</h2><p>Du hast Leserechte. Neue Einträge können von berechtigten Personen erfasst werden.</p>';
    if(!salesCan('contact.create'))root.querySelector('[name="communicationContact"] option[value="__new"]')?.remove();
    if(!salesCan('finance.read')){
      for(const el of root.querySelectorAll('.m-list-end'))el.remove();
      root.querySelector('[name="v1History"]')?.closest('label')?.remove();
      for(const form of root.querySelectorAll('form[data-form="edition"]'))form.hidden=true;
    }
    if(!salesCan('projects.read'))root.querySelector('[data-customer-list="projects"]')?.remove();
    if(!salesCan('settings.edit'))for(const form of root.querySelectorAll('form[data-form="edition"],form[data-form="edition-selection"],form[data-form="project-search"]'))form.querySelectorAll('input,select,button').forEach(el=>el.disabled=true);
  }
  root.addEventListener('click',e=>{
    const b=e.target.closest('[data-action]');if(!b||!b.dataset.action.startsWith('auth-'))return;e.stopImmediatePropagation();
    if(b.dataset.action==='auth-login')salesBeginLogin();
    if(b.dataset.action==='auth-setup')act(async()=>{await salesDirectRpc('saveSalesAuthSetup',{allowedOrigins:[location.origin]});salesSetupConfig=await salesDirectRpc('getSalesAuthSetup');return {message:'Vorbereitet. Bitte jetzt das bisherige Administratorkonto bestätigen.'};});
    if(b.dataset.action==='auth-enable')act(async()=>{const r=await salesDirectRpc('enableSalesLogin',salesLoginSession?.id);salesSetupBound=false;return r;});
    if(b.dataset.action==='auth-logout')act(async()=>{try{await rpc('logoutSalesUser');}finally{salesForgetLogin();}});
    if(b.dataset.action==='auth-users'||b.dataset.action==='auth-more')act(async()=>{const r=await rpc('listSalesUsers',b.dataset.action==='auth-more'?salesUserCursor:null);salesUserRows=b.dataset.action==='auth-more'?[...salesUserRows,...r.users]:r.users;salesUserCursor=r.next;});
    if(b.dataset.action==='auth-copy')navigator.clipboard.writeText(salesInvitationLink).catch(()=>root.querySelector('[data-invitation-link]')?.select());
  });
  root.addEventListener('submit',e=>{
    const form=e.target;if(!['auth-user','auth-invite'].includes(form.dataset.form))return;e.preventDefault();e.stopImmediatePropagation();if(busy||!form.reportValidity())return;
    const permissions=Object.fromEntries(SALES_PERMISSION_CATALOG.map(([key])=>[key,form.querySelector('[name="permission:'+key+'"]')?.checked===true]));
    act(async()=>{if(form.dataset.form==='auth-invite'){const r=await rpc('createSalesUserInvitation',{email:form.elements.email.value,permissions});salesInvitationLink=r.url;return r;}
      const r=await rpc('updateSalesUser',{uid:form.dataset.uid,revision:Number(form.dataset.revision),status:form.elements.status.value,permissions});salesUserRows=salesUserRows.map(u=>u.uid===r.user.uid?r.user:u);return r;});
  });

  root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='pause-import'){v1Click(a,id);return;}if(busy)return;if(v1Click(a,id))return;if(a==='theme'){theme=theme==='dark'?'light':'dark';root.dataset.theme=theme;b.textContent=theme==='dark'?'Helle Ansicht':'Dunkle Ansicht';try{localStorage.setItem('sales-theme',theme);}catch(_){}return;}if(a==='nav')return act(async()=>{search='';message='';await openView(id);});
    if(a==='reload')return act(async()=>{await refreshCurrentView();return {message:'Diese Ansicht frisch aus Firebase geladen. Kein HQ-Aufruf.'};});
    if(a==='company')return act(async()=>{historyFilter='all';selected=id;detail=await loadCompany(id);if(detail?.company?.localDraftId)selected=detail.company.id;view='company';});
    if(a==='read-company')return act(async()=>{detail=await loadCompany(id,true);return {message:detail?'Firmendetails aus Firebase geladen.':'Noch keine Firmendetails in Firebase. Bitte den Detailimport starten.'};});
    if(a==='sync-history')return act(()=>rpc('syncSalesHistory',id));
    if(a==='check-history-binding')return act(async()=>{try{return await rpc('checkSalesHistoryBinding',id);}finally{if(view==='company')detail=await loadCompany(selected,true);}});
    if(a==='sync-company')return act(()=>rpc('syncSalesCompany',id));
    if(a==='sync-edition')return act(()=>rpc('syncSalesEdition'));
    if(a==='sync-catalog')return act(()=>rpc('syncSalesCatalog'),{});
    if(a==='audit-test')return act(async()=>{audit=await rpc('getSalesTestAudit',id);auditId=id;return {message:'Eigene Testfirma in HQ und Firebase verglichen.'};});
    if(a==='contact-email')return act(async()=>{const r=await rpc('queueSalesContactEmail',id);preview=await rpc('getSalesJobPreview',r.id);view='preview';return r;},{});
    if(a==='cleanup-marker')return act(async()=>{const r=await rpc('queueSalesMarkerCleanup',id);preview=await rpc('getSalesJobPreview',r.id);view='preview';return r;},{});
    if(a==='preview')return act(async()=>{preview=await rpc('getSalesJobPreview',id);view='preview';});
    if(a==='create-company'||a==='create-contact')return runCreateJob(id,a==='create-company'?'company':'contact');
    if(a==='run-job'){const job=state.jobs.find(j=>j.id===id);if(job?.kind==='createCompany')return runCreateJob(id,'company');return act(async()=>{const r=await rpc('runSalesJob',id);preview=await rpc('getSalesJobPreview',id);if(preview.job.kind==='cleanupMarker'&&r.state==='synced'){audit=null;auditId=null;}return r;},{});}
    if(a==='reconcile')return act(async()=>{const r=await rpc('reconcileSalesJob',id);if(selected==='draft_'+id)detail=await loadCompany(selected);return r;},{});
    if(a==='conflict-hq'||a==='conflict-app')return act(()=>rpc('resolveSalesConflict',id,a==='conflict-hq'?'hq':'app'),{});
    if(a==='change-form')return act(async()=>{formDraft=state.drafts.find(d=>d.id===id);detail=await loadCompany(formDraft.hqId);if(!detail)throw new Error('Zuerst Firmendetails importieren.');view='change';});
  });
  root.addEventListener('input',e=>{if(e.target.id==='customer-name-search'){search=e.target.value;root.querySelector('#customer-rows').innerHTML=v1SimpleCustomerRows();return;}if(e.target.id==='contact-search'){const position=e.target.selectionStart;search=e.target.value;render();const input=root.querySelector('#contact-search');input.focus();input.setSelectionRange(position,position);return;}if(e.target.id==='search'){search=e.target.value;root.querySelector('#customer-rows').innerHTML=v1CustomerRows(view!=='magazine');}});
  root.addEventListener('change',e=>{if(v1Change(e))return;if(e.target.name==='addressOrigin'){const label=root.querySelector('#origin-other');label.hidden=e.target.value!=='Sonstige';label.querySelector('input').required=e.target.value==='Sonstige';}});
  root.addEventListener('submit',e=>{e.preventDefault();if(busy)return;const form=e.target;if(form.elements.homepage)form.elements.homepage.value=normalizeHomepageInput(form.elements.homepage.value);if(!form.reportValidity())return;const input=Object.fromEntries(new FormData(form)),kind=form.dataset.form;
    if(kind==='project-search'){searchV1Projects(input.term);return;}
    if(kind==='edition-selection'){importSelectedV1Projects(form);return;}
    act(async()=>{let r;if(kind==='company'){r=await rpc('saveSalesCompany',input);selected='draft_'+r.id;detail=await loadCompany(selected);view='company';}
      if(kind==='change'){r=await rpc('saveSalesCompanyChange',{...input,draftId:formDraft.id});view='test';}
      if(kind==='edition')r=await rpc('saveSalesEditionSettings',{...input,editionId:state.edition.id,revision:state.edition.settings.revision});
      if(kind==='company-search'){companyResults=await rpc('searchSalesCompanies',input.term);r={message:'Unternehmensliste gelesen. Bitte gezielt auswählen.'};}
      if(kind==='access'){state.access=await rpc('saveSalesAccess',input.emails);const cached=viewCache.get('admin');if(cached)cached.access=state.access;r={message:'E-Mail-Freigaben gespeichert.'};}return r;},{preserve:true});
  });
  // No home timer, version poll, TTL refresh or other automatic working-data reads.
  if(salesUsesLogin())render();
  if(!salesUsesLogin())
  act(async()=>{state=await rpc('getSalesLeanState');loadedViews.add('home');});
  window.__salesStarted=true;
})();
</script></body></html>
