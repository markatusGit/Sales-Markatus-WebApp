  });
  window.setTimeout(function(){report('Das Hauptskript wurde innerhalb von 8 Sekunden nicht gestartet. Es wurde keine JavaScript-Fehlermeldung übermittelt.');},8000);

  function historySelection(editions,current,mode){
    if(mode==='all')return {ids:null,message:''};if(!current)return {ids:new Set(),unknown:true,message:'Zuerst eine Ausgabe auswählen.'};
    if(Number(current.issue)<=(mode==='last5'?5:1))return {ids:new Set(),unknown:true,message:'Für diese Ausgabe gibt es noch nicht genügend vorherige Ausgaben für diesen Filter.'};
    const same=editions.filter(e=>e.magazine.toLocaleLowerCase('de')===current.magazine.toLocaleLowerCase('de'));
    const required=mode==='last5'?[1,2,3,4,5].map(n=>Number(current.issue)-n):[Number(current.issue)-1];
    const missing=required.filter(n=>!same.some(e=>Number(e.issue)===n&&e.loadedAt&&e.complete));
    if(missing.length)return {ids:new Set(),unknown:true,message:'Noch nicht auswertbar: '+current.magazine+' #'+missing.join(', #')+' fehlt oder ist unvollständig. Keine fehlende Buchung wird daraus abgeleitet.'};
    const booked=e=>{const sums={};(e.documents||[]).forEach(d=>{sums[d.companyId]=(sums[d.companyId]||0)+d.cents;});return Object.keys(sums).filter(id=>sums[id]>0);};
    if(mode==='last5')return {ids:new Set(same.filter(e=>required.includes(Number(e.issue))).flatMap(booked)),message:'Mindestens einmal mit positivem Netto-Rechnungsbetrag in den fünf Ausgaben vor #'+current.issue+'.'};
    const last=new Set(booked(same.find(e=>Number(e.issue)===Number(current.issue)-1))),earlier=same.filter(e=>Number(e.issue)<Number(current.issue)-1&&e.loadedAt);
    if(!earlier.length)return {ids:new Set(),unknown:true,message:'Noch keine frühere Ausgabe vor der letzten Ausgabe importiert.'};
    return {ids:new Set(earlier.flatMap(booked).filter(id=>!last.has(id))),message:'Nicht in #'+(Number(current.issue)-1)+', aber früher fakturiert. Frühere Historie umfasst ausschließlich die importierten Ausgaben: '+earlier.map(e=>'#'+e.issue).join(', ')+'.'};
  }

  async function searchV1Projects(term){
    projectSearchTerm=term.trim();projectSearchError='';projectSearching=true;projectResults={rows:[],limited:true};projectChoices={};
    await act(async()=>{
      try{
        const seen=new Set();let skip=0;
        for(let page=0;page<50;page++){
          const result=await rpc('searchSalesProjects',projectSearchTerm,skip);
          if(!result||!Array.isArray(result.rows))throw new Error('HQ-Projektsuche hat kein gültiges Ergebnis geliefert.');
          for(const row of result.rows){if(seen.has(String(row.id)))throw new Error('HQ-Suchseiten enthalten doppelte Projekte. Bitte erneut suchen.');seen.add(String(row.id));projectResults.rows.push(row);}
          projectResults.limited=!!result.limited;render();
          if(!result.limited)break;
          if(!Number.isSafeInteger(result.nextSkip)||result.nextSkip<=skip)throw new Error('HQ-Suchseite konnte nicht fortgesetzt werden.');
          skip=result.nextSkip;
        }
        return {message:projectResults.rows.length+' Projekte gefunden. Ergebnisse stehen direkt unter der Suche.'};
      }catch(e){projectSearchError='Projektsuche fehlgeschlagen: '+e.message;throw new Error(projectSearchError);}
      finally{projectSearching=false;}
    });
    root.querySelector('#project-results')?.scrollIntoView({block:'nearest'});
  }
  async function importSelectedV1Projects(form){

    choices.forEach(c=>{projectChoices[c.projectId]={...c};});projectSearchError='';let ids=[];
    await act(async()=>{
      try{
        if(choices.length>200)throw new Error('Bitte höchstens 200 Projekte gleichzeitig auswählen.');
        if(state.syncRun?.state==='running')throw new Error('Zuerst den laufenden Import unter Datenabgleich fortsetzen und abschließen.');
        const keys=choices.map(c=>c.magazine.trim().toLocaleLowerCase('de')+'#'+Number(c.issue));
        if(new Set(keys).size!==keys.length)throw new Error('Zwei ausgewählte Projekte haben dieselbe Magazin-/Ausgabenzuordnung. Bitte prüfen.');
        if(choices.some(c=>!c.magazine.trim()||!Number.isSafeInteger(Number(c.issue))||Number(c.issue)<1))throw new Error('Bitte Magazin und Ausgabennummer aller ausgewählten Projekte ausfüllen.');
        for(const choice of choices){const r=await rpc('saveSalesEditionConfig',choice);ids.push(r.id);if(choice.current)selectedEditionId=r.id;}
        for(const row of form.querySelectorAll('[data-project-row]')){const old=(state.editions||[]).find(e=>String(e.projectId)===row.dataset.projectRow);if(old&&!row.querySelector('[name="projectSelect"]').checked)await rpc('setSalesEditionEnabled',old.id,false);}
        state=await rpc('getSalesState');return {message:'Auswahl in Firebase gespeichert. Unter Datenabgleich den HQ-Sync starten.'};
      }catch(e){projectSearchError='Auswahl noch nicht gestartet: '+e.message+' Bereits gespeicherte Zuordnungen bleiben erhalten; erneutes Übernehmen legt keine zweite Ausgabe an.';throw new Error(projectSearchError);}

    message='Auswahl in Firebase gespeichert. Unter Datenabgleich den HQ-Sync starten.';render();
  }

    if(a==='reconcile')return act(async()=>{const r=await rpc('reconcileSalesJob',id);if(selected==='draft_'+id)detail=await rpc('getSalesCompany',selected);return r;},{reload:true});
    if(a==='conflict-hq'||a==='conflict-app')return act(()=>rpc('resolveSalesConflict',id,a==='conflict-hq'?'hq':'app'),{reload:true});
    if(a==='history-form'){if(!state.drafts.find(d=>d.id===id)?.testOnly||!state.jobs.find(j=>j.id===id)?.hqId){error='Zuerst die eigene Testfirma in HQ anlegen.';render();return;}formDraft=state.drafts.find(d=>d.id===id);const now=new Date();formContactOn=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,16);view='history';render();return;}
    if(a==='change-form')return act(async()=>{formDraft=state.drafts.find(d=>d.id===id);detail=await rpc('getSalesCompany',formDraft.hqId);if(!detail)throw new Error('Zuerst Firmendetails importieren.');view='change';});
  });
  root.addEventListener('input',e=>{if(e.target.id==='customer-name-search'){search=e.target.value;root.querySelector('#customer-rows').innerHTML=v1SimpleCustomerRows();return;}if(e.target.id==='contact-search'){const position=e.target.selectionStart;search=e.target.value;render();const input=root.querySelector('#contact-search');input.focus();input.setSelectionRange(position,position);return;}if(e.target.id==='search'){search=e.target.value;root.querySelector('#customer-rows').innerHTML=v1CustomerRows(view!=='magazine');}});
  root.addEventListener('change',e=>{if(v1Change(e))return;if(e.target.name==='channel'){updateHistoryFields();return;}if(e.target.name==='historyFilter'){historyFilter=e.target.value;render();return;}if(e.target.name==='addressOrigin'){const label=root.querySelector('#origin-other');label.hidden=e.target.value!=='Sonstige';label.querySelector('input').required=e.target.value==='Sonstige';}});
  root.addEventListener('submit',e=>{e.preventDefault();if(busy)return;const form=e.target;if(form.elements.homepage)form.elements.homepage.value=normalizeHomepageInput(form.elements.homepage.value);if(!form.reportValidity())return;const input=Object.fromEntries(new FormData(form)),kind=form.dataset.form;
    if(kind==='project-search'){searchV1Projects(input.term);return;}
    if(kind==='edition-selection'){importSelectedV1Projects(form);return;}
    act(async()=>{let r;if(kind==='company'){r=await rpc('saveSalesTestCompany',input);selected='draft_'+r.id;detail=await rpc('getSalesCompany',selected);view='company';}
      if(kind==='history'){r=await rpc('saveSalesHistory',{...input,contactOn:input.channel==='Mail'?'':new Date(input.contactOn).toISOString(),draftId:formDraft.id});selected='draft_'+formDraft.id;detail=await rpc('getSalesCompany',selected);historyFilter='all';view='company';}
      if(kind==='change'){r=await rpc('saveSalesCompanyChange',{...input,draftId:formDraft.id});view='test';}
      if(kind==='edition')r=await rpc('saveSalesEditionSettings',{...input,editionId:state.edition.id,revision:state.edition.settings.revision});
      if(kind==='company-search'){companyResults=await rpc('searchSalesCompanies',input.term);r={message:'Unternehmensliste gelesen. Bitte gezielt auswählen.'};}
      if(kind==='access'){await rpc('saveSalesAccess',input.emails);r={message:'E-Mail-Freigaben gespeichert.'};}return r;},{reload:true,preserve:true});
  });
  // Refresh dashboards only; never interrupt a form or invoke HQ in the background.
  setInterval(()=>{if(!busy&&state&&view==='home')act(async()=>{state=await rpc('getSalesState');});},60000);
  act(async()=>{state=await rpc('getSalesState');});
  window.__salesStarted=true;
})();
</script></body></html>
