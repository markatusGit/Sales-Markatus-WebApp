<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales Markatus · Anmeldung</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Sales Markatus</h1><p id="purpose">Mit deinem freigegebenen Konto anmelden.</p><p id="status" role="status" aria-live="polite"></p><button id="google" type="button">Mit Google anmelden</button><form id="login"><label>E-Mail-Adresse<input id="email" type="email" autocomplete="username" maxlength="254" required></label><label>Passwort<input id="password" type="password" autocomplete="current-password" required></label><button id="submit" type="submit">Anmelden</button></form><div id="verification" hidden><button id="send-verification" type="button">Bestätigungsmail senden</button><button id="verified" type="button">E-Mail bestätigt · weiter</button></div><button id="forgot" type="button">Passwort vergessen</button><p>Nur ausdrücklich freigegebene Konten erhalten Zugriff. Dein Passwort wird nicht an die Verwaltung übermittelt.</p></main><script type="module" src="login.mjs"></script></body></html>
